<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint</title>
<meta name="description" content="Waypoint: food, training and progress tracking for iPhone and Apple Watch.">
<style>
:root {
  --bg: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --rule: #e5e5ea;
  --accent: #0a7d5a;
  --card: #f5f5f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --rule: #2c2c2e;
    --accent: #3ddc97;
    --card: #1c1c1e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
nav { display: flex; gap: 20px; margin-bottom: 40px; font-size: 15px; }
nav a { color: var(--muted); text-decoration: none; }
nav a:hover, nav a[aria-current] { color: var(--text); }
h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
h2 { font-size: 21px; margin: 40px 0 8px; letter-spacing: -0.01em; }
h3 { font-size: 17px; margin: 24px 0 4px; }
p, ul { margin: 0 0 14px; }
ul { padding-left: 22px; }
li { margin-bottom: 6px; }
a { color: var(--accent); }
.meta { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
.summary { background: var(--card); border-radius: 14px; padding: 18px 20px; margin: 0 0 8px; }
.summary p:last-child, .summary ul:last-child { margin-bottom: 0; }
footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<nav><a href="index.html" aria-current="page">Waypoint</a><a href="privacy.html">Privacy</a><a href="support.html">Support</a></nav>

<h1>Waypoint</h1>
<p class="meta">For iPhone and Apple Watch</p>
<p>Log food, water and weight, plan and record workouts, and follow your progress, all in one app. Your data stays on your devices and in your own iCloud.</p>
<ul>
  <li><a href="support.html">Support</a></li>
  <li><a href="privacy.html">Privacy Policy</a></li>
</ul>

</main>
</body>
</html>
